name: Quality Gate - Visitas Medicas

on:
  push:
    branches:
      - main
      - 'spec/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visita-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-policy:
    name: API contract and privacy policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard against source clinical documents
        run: |
          if git ls-files | grep -Eiq '\.(pdf|docx|zip|emf|db|sqlite)$'; then
            echo 'Clinical documents or database dumps must never be committed.'
            exit 1
          fi
      - name: Syntax checks
        run: |
          node --check src/domain/visit-policy.mjs
          for test_file in test/*.test.mjs; do
            node --check "$test_file"
          done
      - name: Domain security and API contract tests
        run: npm test

  mobile-bundle:
    name: Expo typecheck and Android/iOS JS bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck
      - name: React Native rendered interaction tests (phone/tablet)
        run: npm run test:ui
      - name: Export Android JavaScript bundle
        run: npm run export:android
      - name: Export iOS JavaScript bundle
        run: npm run export:ios
      - name: Confirm bundles exist
        run: |
          test -d dist/android
          test -d dist/ios
