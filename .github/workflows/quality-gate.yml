name: Quality Gate - Visitas Medicas

on:
  push:
    branches:
      - main
      - 'spec/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visita-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-policy:
    name: API contract and privacy policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard against source clinical documents
        run: |
          if git ls-files | grep -Ei '\\.(pdf|docx|zip|emf|db|sqlite)$'; then
            echo 'Clinical documents or database dumps must never be committed.'
            exit 1
          fi
      - name: Syntax checks
        run: |
          node --check src/domain/visit-policy.mjs
          for test_file in test/*.test.mjs; do
            node --check "$test_file"
          done
      - name: Domain security and API contract tests
        run: npm test
