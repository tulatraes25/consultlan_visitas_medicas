name: Quality Gate - Visitas Medicas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visita-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-policy:
    name: API contract and privacy policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard against source clinical documents
        run: |
          if git ls-files | grep -Eiq '\.(pdf|docx|zip|emf|db|sqlite)$'; then
            echo 'Clinical documents or database dumps must never be committed.'
            exit 1
          fi
      - name: Syntax checks
        run: |
          node --check src/domain/visit-policy.mjs
          node --check src/domain/homecare-policy.mjs
          for test_file in test/*.test.mjs; do
            node --check "$test_file"
          done
      - name: Domain security and API contract tests
        run: npm test

  mobile-bundle:
    name: Expo typecheck and Android/iOS JS bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck
      - name: React Native rendered interaction tests (phone/tablet)
        run: npm run test:ui
      - name: Export Android JavaScript bundle
        run: npm run export:android
      - name: Export iOS JavaScript bundle
        run: npm run export:ios
      - name: Confirm bundles exist
        run: |
          test -d dist/android
          test -d dist/ios

  supabase-rls:
    name: PostgreSQL RLS and cross-tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: visits_synthetic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_fake_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visits_synthetic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: visits_synthetic_test
      PGUSER: postgres
      PGPASSWORD: ci_only_fake_password
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Prepare synthetic Supabase Auth shim
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/postgres_auth_stub.sql
      - name: Apply standalone Supabase migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010000000_standalone_foundation.sql
      - name: Test actual PostgreSQL RLS, denials and integrity
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql
      - name: Apply trusted operational command migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010010000_operational_commands.sql
      - name: Exercise role-scoped backend commands and race prevention
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/operational_commands.sql

  edge-functions:
    name: Deno Edge JWT boundary and request validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Install Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Strict type check of Edge runtime and tests
        run: deno check supabase/functions/visits/index.ts supabase/functions/visits/handler.test.ts
      - name: Exercise authenticated Edge handler without cloud credentials
        run: deno test supabase/functions/visits/handler.test.ts
      - name: Enforce Edge-only secret references
        run: |
          if grep -R -nE 'SUPABASE_(SERVICE_ROLE_KEY|SECRET_KEY)' apps/mobile/src apps/mobile/App.tsx; then
            echo 'A mobile component must not include server-side secrets.'
            exit 1
          fi
