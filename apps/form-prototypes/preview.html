TION_REQUEST"}]},{"id":"NUTRITION_ATTENDANCE","source":"Nutrición","specialty":"NUTRICION","kind":"ATTENDANCE","headerFields":[{"id":"homecarePatient","sourceLabel":"Paciente","kind":"CASE_CONTEXT"},{"id":"insurer","sourceLabel":"Obra social","kind":"CASE_CONTEXT"}],"rowFields":[{"id":"serviceDate","sourceLabel":"Fecha","kind":"DATE_ONLY"},{"id":"professionalSignature","sourceLabel":"Firma y sello profesional","kind":"PROFESSIONAL_SIGNATURE_REQUEST"},{"id":"responsibleSignature","sourceLabel":"Firma tutor","kind":"RESPONSIBLE_ATTESTATION_REQUEST"}]},{"id":"CLINICAL_EVOLUTION","source":"Hoja evolución","specialty":"EQUIPO_TRATANTE_SEGUN_ASIGNACION","kind":"CLINICAL_EVOLUTION","headerFields":[{"id":"homecarePatient","sourceLabel":"Paciente","kind":"CASE_CONTEXT"},{"id":"insurer","sourceLabel":"Obra social","kind":"CASE_CONTEXT"},{"id":"sheetDate","sourceLabel":"Fecha","kind":"DATE_ONLY"}],"rowFields":[{"id":"evolution","sourceLabel":"Evolución","kind":"CLINICAL_NARRATIVE"}]}],"paper":[{"id":"KARDEX","source":"Ficha Kardex","confirmedLabels":["Paciente","Medicación"],"unknownColumns":true,"restrictions":["No inferir dosis, vía, frecuencia ni encabezados no legibles.","Permanece físicamente en el domicilio."]},{"id":"VITAL_SIGNS","source":"Signos vitales","confirmedLabels":["Paciente","Fecha","Horario","SpO2","FC","FR","T°","T/A","Firma y sello"],"unknownColumns":false,"restrictions":["No establecer umbrales ni reglas de alarmas clínicas.","Permanece físicamente en el domicilio."]},{"id":"PROCEDURE_SHEET","source":"Control procedimientos","confirmedLabels":["Paciente","Obra social","Fecha","Horario","Procedimiento","Firma profesional"],"unknownColumns":false,"restrictions":["Los procedimientos indicados en origen no forman un catálogo cerrado.","No documentar una práctica ejecutada con una referencia al papel."]},{"id":"CRISIS_SHEET","source":"Hoja de crisis","confirmedLabels":["Fecha","Tipo de crisis","Duración"],"unknownColumns":false,"restrictions":["No implica triaje o monitoreo de emergencias.","Permanece físicamente en el domicilio."]}],"monthlyDossier":{"source":"PDF mensual de 56 páginas escaneadas","status":"REFERENCE_ONLY"}}</script><script>

(function(){
"use strict";
const catalog=JSON.parse(document.getElementById("hc-catalog").textContent);
const forms=catalog.templates;
const attendance=forms.filter(function(x){return x.kind==="ATTENDANCE";});
const paper=catalog.paper;
const selectedDefault="NURSING_CAREGIVER_ATTENDANCE";
let selectedId=selectedDefault,view="inicio";
const app=document.getElementById("stage");
function escapeHtml(text){return String(text==null?"":text).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
function contract(){return forms.find(function(x){return x.id===selectedId;})||forms[1];}
function clean(){return '<div class="notice"><strong>DEMO SIN VALIDEZ.</strong> Todos los datos son inventados. No se almacenan prestaciones, pacientes, firmas ni documentos y no se conecta con un servidor.</div>';}
function title(s,t,p){return '<div><p class="overline">'+escapeHtml(s)+'</p><h1>'+escapeHtml(t)+'</h1><p class="intro">'+escapeHtml(p)+'</p></div>';}
function button(text,action,primary){return '<button type="button" class="btn'+(primary?' primary':'')+'" data-action="'+action+'">'+escapeHtml(text)+'</button>';}
function steps(n){return '<div class="steps" aria-label="Recorrido de prestación"><span class="step '+(n===1?'active':'')+'">1 · Mi prestación</span><span class="step '+(n===2?'active':'')+'">2 · Mi planilla</span><span class="step '+(n===3?'active':'')+'">3 · Documento</span></div>';}
function specialty(id){const s={"MEDICAL_ATTENDANCE":"Medicina","NURSING_CAREGIVER_ATTENDANCE":"Enfermería y cuidados","PHYSIOTHERAPY_ATTENDANCE":"Kinesiología","SPEECH_ATTENDANCE":"Fonoaudiología","OCCUPATIONAL_THERAPY_ATTENDANCE":"Terapia ocupacional","NUTRITION_ATTENDANCE":"Nutrición"};return s[id]||"Equipo tratante";}
function valueOf(field){
 if(field.kind==="PROFESSIONAL_SIGNATURE_REQUEST"||field.kind==="RESPONSIBLE_ATTESTATION_REQUEST")return "PENDIENTE · firma deshabilitada";
 if(field.kind==="DATE_ONLY")return "12/10/2026 · DEMO";
 if(field.kind==="TIME_ONLY")return selectedId===selectedDefault?"20:00 a 08:00 (+1 día) · DEMO":"11:00 a 12:00 · DEMO";
 if(field.kind==="CLINICAL_NARRATIVE")return "No redactada. Solo profesional autorizado.";
 return "DATO FICTICIO";
}
function valueLabel(field){
 if(field.id==="homecarePatient")return "EPISODIO FICTICIO · EPI-DEMO-01";
 if(field.id==="insurer")return "OBRA SOCIAL DEMO";
 return valueOf(field);
}
function fields(arr){return '<div class="fields">'+arr.map(function(f){return '<div class="field" data-field-id="'+escapeHtml(f.id)+'"><small>'+escapeHtml(f.sourceLabel)+'</small><strong>'+escapeHtml(valueLabel(f))+'</strong></div>';}).join("")+'</div>';}
function chooser(){return '<label for="specialty">Comparar otra profesión (solo demostración)</label><select class="selector" id="specialty" aria-label="Cambiar especialidad ficticia">'+attendance.map(function(f){return '<option value="'+escapeHtml(f.id)+'" '+(f.id===selectedId?'selected':'')+'>'+escapeHtml(specialty(f.id))+'</option>';}).join("")+'</select><p class="tiny">En el sistema real no se elige una profesión: se obtiene de la cuenta y de la asignación autorizada.</p>';}
function inicio(){const f=contract();return title("HC-UX-02 · atención domiciliaria","Una tarea por vez","El profesional abre su prestación y el sistema le muestra la planilla correcta, sin buscar entre documentos.")+clean()+steps(1)+'<div class="layout"><section class="card accent"><div class="topline"><span class="tag">UNA PRESTACIÓN FICTICIA</span><span class="tag warn">NO REGISTRADA</span></div><span class="itemtitle">Tu próxima tarea</span><p class="case">'+escapeHtml(specialty(selectedId))+'</p><p class="sub">EPI-DEMO-01 · Obra social demo</p><hr class="rule"><h2>'+escapeHtml(f.source)+'</h2><p class="sub">'+(selectedId===selectedDefault?"Guardia nocturna 20:00–08:00 (+1 día).":"Prestación ficticia. La fecha y el horario se acreditarán con la asignación.")+'</p><div class="actions">'+button("Abrir mi prestación","go-form",true)+'</div></section><section class="card soft"><h2>Así de sencillo</h2><p class="helper"><strong>1.</strong> Abrí la prestación asignada.</p><p class="helper"><strong>2.</strong> Revisá los campos de tu planilla.</p><p class="helper"><strong>3.</strong> Mirá el borrador documental (no emitido).</p><hr class="rule">'+chooser()+'</section></div>';}
function formView(){const f=contract();return title("Mi prestación · "+f.id,"La planilla que corresponde","Los rótulos se generan desde el catálogo HC-03A. No hay captura ni almacenamiento clínico.")+clean()+steps(2)+'<section class="card"><span class="tag">'+escapeHtml(f.kind==="ATTENDANCE"?"CONSTANCIA DE ASISTENCIA":"EVOLUCIÓN SEPARADA")+'</span><h2 style="margin-top:17px">'+escapeHtml(f.source)+'</h2><p class="sub">Datos del episodio · solo contexto inventado</p>'+fields(f.headerFields)+'<hr class="rule"><h2>Campos verificados de la hoja</h2>'+fields(f.rowFields)+'<p class="helper">Las firmas familiares, profesionales y la redacción clínica permanecen deshabilitadas hasta aprobación institucional. Un trazo en pantalla no equivale a una firma digital certificada.</p><div class="actions">'+button("Volver a inicio","home",false)+button("Ver borrador de la planilla","go-document",true)+'</div></section>';}
function docRow(f){return '<td data-label="'+escapeHtml(f.sourceLabel)+'">'+escapeHtml(valueOf(f))+'</td>';}
function documentView(){const f=contract();return title("Vista documental · solo demostración","Borrador de la planilla","La meta es obtener la documentación correcta sin duplicar el trabajo. Esta vista no es un documento emitido.")+clean()+steps(3)+'<section class="card"><article class="sheet" aria-label="Borrador ficticio sin validez"><div class="watermark" aria-hidden="true">DEMO SIN VALIDEZ</div><div class="sheethead"><div><strong>Pediatrics</strong><p class="tiny">Internación domiciliaria · estructura de plantilla</p></div><span class="tag warn">NO EMITIDO</span></div><h2>'+escapeHtml(f.source)+'</h2><div class="sheetmeta">'+f.headerFields.map(function(h){return '<span><strong>'+escapeHtml(h.sourceLabel)+'</strong>: '+escapeHtml(valueLabel(h))+'</span>';}).join("")+'</div><table class="source-table"><thead><tr>'+f.rowFields.map(function(x){return '<th scope="col">'+escapeHtml(x.sourceLabel)+'</th>';}).join("")+'</tr></thead><tbody><tr>'+f.rowFields.map(docRow).join("")+'</tr></tbody></table><p class="footnote"><strong>NO EMITIDO, NO FIRMADO, SIN VALIDEZ ASISTENCIAL NI LEGAL.</strong> Este borrador conserva solo los campos confirmados en HC-03A. No reproduce el formato original DOCX/PDF completo.</p></article><div class="actions">'+button("Revisar mi planilla","go-form",false)+button("Ver expediente mensual","go-monthly",true)+'</div></section>';}
function catalogView(){return title("Material de Pediatrics","Planillas de asistencia","Seis modelos de asistencia separados de la hoja de evolución. El profesional no tendrá que elegir entre ellos en el uso real.")+clean()+'<section class="card"><h2>Seis constancias por especialidad</h2>'+attendance.map(function(f){return '<div class="paper"><div><strong>'+escapeHtml(f.source)+'</strong><br><small>'+escapeHtml(specialty(f.id))+' · '+f.rowFields.length+' campos verificados</small></div>'+button("Ver","select:"+escapeHtml(f.id),false)+'</div>';}).join("")+'<hr class="rule"><h2>Documento clínico diferente</h2><div class="paper"><div><strong>'+escapeHtml(forms.find(function(f){return f.id==="CLINICAL_EVOLUTION";}).source)+'</strong><br><small>La evolución no es una constancia de asistencia.</small></div>'+button("Ver","select:CLINICAL_EVOLUTION",false)+'</div><p class="helper">Estas vistas son modelos. No se pueden completar, firmar ni presentar.</p></section>';}
function monthlyView(){return title("Expediente mensual · referencia","Un mes de documentación","El material original de 56 páginas está inventariado como referencia; no se reprodujeron páginas, sellos ni datos identificables.")+clean()+'<div class="layout"><section class="card"><div class="topline"><span class="tag warn">0 documentos emitidos</span><span class="tag">EPI-DEMO-01</span></div><h2>Qué integraría un expediente futuro</h2><p class="helper">Constancias de asistencia por profesión y evolución por separado, solo cuando sus estados y firmas sean válidos y estén autorizados.</p>'+forms.map(function(f){return '<div class="paper"><div><strong>'+escapeHtml(f.source)+'</strong><br><small>'+escapeHtml(f.kind==="ATTENDANCE"?"Constancia · NO EMITIDA":"Evolución · NO REDACTADA")+'</small></div><span class="tag warn">Pendiente</span></div>';}).join("")+'</section><section class="card soft"><h2>Permanece en domicilio</h2>'+paper.map(function(p){return '<div class="paper"><div><strong>'+escapeHtml(p.source)+'</strong><br><small>Fuente física; no sustituida ni digitalizada</small></div><span class="tag warn">PAPEL</span></div>';}).join("")+'<hr class="rule"><p class="helper"><strong>Fuente:</strong> '+escapeHtml(catalog.monthlyDossier.source)+'</p><p class="tiny">No hay foliado final aprobado ni PDF clínico generado. La composición del expediente y los requerimientos de la obra social requieren revisión de Pediatrics.</p></section></div>';}
function helpView(){return title("Ayuda para empezar","No necesitás aprender a programar","Si tenés una prestación asignada, el sistema debe abrir la planilla correcta en pocos pasos.")+clean()+'<section class="card"><p class="helper"><strong>Paso 1:</strong> Desde Inicio, elegí «Abrir mi prestación».</p><p class="helper"><strong>Paso 2:</strong> Revisá la cabecera ficticia y los rótulos de la planilla.</p><p class="helper"><strong>Paso 3:</strong> Observá el borrador «NO EMITIDO».</p><p class="helper">En la práctica real, el formulario se vinculará a un episodio y a una cobertura autorizados, nunca a un paciente de CONSULTLAN ambulatorio.</p><div class="actions">'+button("Volver a Inicio","home",true)+'</div></section>';}
const navigation={inicio:inicio,form:formView,document:documentView,planillas:catalogView,mensual:monthlyView,ayuda:helpView};
function render(){
 app.innerHTML=(navigation[view]||inicio)();
 document.querySelectorAll("[data-section]").forEach(function(button){
  if(button.dataset.section===view||(view==="form"||view==="document")&&button.dataset.section==="inicio")button.setAttribute("aria-current","page");
  else button.removeAttribute("aria-current");
 });
}
document.addEventListener("click",function(event){
 const button=event.target.closest("button");if(!button||button.disabled)return;
 const section=button.dataset.section;if(section&&navigation[section]){view=section;render();return;}
 const action=button.dataset.action;if(!action)return;
 if(action.indexOf("select:")===0){const id=action.slice(7);if(forms.some(function(f){return f.id===id;})){selectedId=id;view="form";}}
 else if(action==="go-form"){view="form";}
 else if(action==="go-document"){view="document";}
 else if(action==="go-monthly"){view="mensual";}
 else if(action==="home"){view="inicio";}
 render();
});
document.addEventListener("change",function(event){
 if(event.target.id==="specialty"){
  const id=event.target.value;
  if(attendance.some(function(f){return f.id===id;})){selectedId=id;render();}
 }
});
render();
window.HC_UX02_DEMO=Object.freeze({templates:forms.length,attendance:attendance.length,paper:paper.length,source:catalog.sourceContract,emissionEnabled:false,signatureCaptureEnabled:false,patientDataReal:false});
}());
